name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.project --project-name egg_pam_controller .
          fi

      # ระบบจะทำการเติมบลูทูธลงในไฟล์ pubspec.yaml ให้เองโดยอัตโนมัติอย่างถูกต้อง 100%
      - name: Auto Add Bluetooth Plugin
        run: |
          flutter pub add flutter_blue_plus

      - name: Get packages and Build
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-EGG-PAM-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
